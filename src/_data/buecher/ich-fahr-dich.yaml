logline: "Staatsanwalt Richard holt die Tochter seines alten Mentors vom Flughafen ab. Überfordert von ihrer plötzlichen Fraulichkeit, verliert er sie kurzzeitig und überlässt sie demselben Serientäter, dessentwegen ihr Vater überhaupt angereist ist. Richard verspricht ihr, zu schweigen."
klappentext: |
  Diesen einen Vergewaltiger dran zu bekommen, ist karriereentscheidend, so viel ist Staatsanwalt Richard Horvath klar. Wenn ihm dabei irgendjemand eine Hilfe sein wird, dann sein Mentor aus Referendariatszeiten, der berühmte Oberstaatsanwalt Bernd Grund. Der kommt, Richard zuliebe, sogar persönlich, und er bringt seine Töchter mit. Auf das Wiedersehen hat Richard sich gewissenhaft vorbereitet. Dummerweise hat er dabei nicht bedacht, wie die vergangenen zehn Geburtstage, zu denen er der kleinen Mara stets eine Glückwunschkarte schickte, ihre Erscheinung verändert haben. So erwischt es ihn in der Flughafenhalle eiskalt, als diese distanzgebietend anmutige Fremde ihn mit unerhörter Vertraulichkeit begrüßt. Wer unter Schock steht, der scheitert mitunter an den simpelsten Aufgaben. Er hätte sie durch diese Stadt, deren Fahrradkeller ihm aus den Ermittlungsakten so wohlbekannt sind, einfach nur heil nach Hause manövrieren müssen. Er hätte sie nur fahren müssen.
lieblingsstelle: |
  Im Feierabendverkehr trieben wir dahin. Mara beugte sich vor und drehte sich zur Seite, schaute aus verengten Augen in den bunt erleuchteten Regen, als teile er ihr irgendetwas Wichtiges mit. Ihr Fuß wippte sachte im Takt, auf unerklärliche, widersinnige, wundersame Weise unbeschwert. Der Umschlag tanzte wie vergessen auf ihrem Schoß. Als ginge das. Als könnte man wirklich – und man musste ja schließlich, konnte gar nicht anders – aber nein, ich durfte nicht, wenngleich ich uns beiden nichts sehnlicher wünschte – aber sie, aber wie, wie konnte man sowas je: vergessen.
warum: "Die erste Szene dieses Romans habe ich in leicht abgewandelter Form geträumt."
