name: Josie H. Matchèque

# Motto: Quod erat scribendum
motto: Q.E.S.
leitsatz: Was geschrieben werden muss

# Für Google und Link-Vorschauen, höchstens 155 Zeichen
beschreibung: "Josie H. Matchèque: Romane und Novellen. Q.E.S. – Was geschrieben werden muss."

# Startseite
einleitung: |
  Schreiben ist ein einsames Unterfangen. Auf diesen Seiten teile ich meine Romane und Erzählungen mit der Welt, auf dass sie für andere Ähnliches oder auch ganz Anderes bedeuten mögen, als für mich.
neuigkeit: "Stolz verkünde ich, dass mein Roman [„Alma Mater“](/buecher/alma-mater/) vollendet ist und nach einer Agentur sucht."

# Kurzvita in der 3. Person
kurzvita: "Josie H. Matchèque wuchs in Hamburg auf. Sie studierte Psychologie in Luxemburg, Hamburg und Greifswald und wurde 2024 promoviert. Sie schreibt seit 2019 Romane und lebt in Hannover."

# Für Agenturen und Verlage
status: "Ich suche derzeit eine Literaturagentur und biete meine Manuskripte auch direkt Verlagen an."
angeboten: [ich-fahr-dich, alma-mater]
themen: Existenzielle Krisen, intelligente Protagonisten, Loyalität und Integrität
stil: Zwanzigstes-Jahrhundert-Stil
vergleichbar: Donna Tartt, Juli Zeh

# Was ich lese (Über mich)
lektuere:
