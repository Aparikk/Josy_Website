    warum: "Er schafft es, das Scheitern so zu beschreiben, dass man es nachmachen will, korrigiere: muss."
  - autor: Thomas Mann
    warum: "Da sieht man erst, was man an der deutschen Sprache hat."
  - autor: Vladimir Nabokov
    warum: "Der kann einem wirklich alles erzählen."

